name: Jev trade

on:
  schedule:
    # H1 bars: shortly after each hour, Sun 22:00 UTC – Fri 22:00 UTC (forex week).
    # GitHub may delay scheduled runs by several minutes.
    - cron: "3 * * * 1-5"
    - cron: "3 22,23 * * 0"
  workflow_dispatch:

concurrency:
  group: jev-trade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one trading pass
        run: python -m advisor.main --config config.toml
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          # Repository variable (not secret). Orders are only sent when this is "true".
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
