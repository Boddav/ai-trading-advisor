name: Refresh cTrader token

on:
  schedule:
    # cTrader access tokens last ~30 days; rotate weekly (Saturday, market closed).
    - cron: "17 6 * * 6"
  workflow_dispatch:
  # Only so GitHub registers this workflow when the file changes; the job is skipped on push.
  push:
    paths:
      - .github/workflows/refresh-token.yml

concurrency:
  group: jev-trade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m advisor.tokens refresh
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          # Fine-grained PAT for this repo with "Secrets: Read and write" permission
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
